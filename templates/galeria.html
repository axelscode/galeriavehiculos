<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Galería de Vehículos - Mi Colección</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            transition: all 0.3s;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header con controles */
        .header {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        body.dark-mode .header {
            background: rgba(30,30,40,0.95);
            color: white;
        }

        .header h1 {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            background: #667eea;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .view-btn {
            background: #764ba2;
        }

        /* Grid de vehículos */
        .vehiculos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        /* Tarjeta de vehículo */
        .vehiculo-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        body.dark-mode .vehiculo-card {
            background: #2d2d3a;
            color: white;
        }

        .vehiculo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .vehiculo-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .vehiculo-header h2 {
            font-size: 1.1rem;
            margin: 0;
            word-break: break-word;
        }

        .vehiculo-stats {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
        }

        .toggle-icon {
            transition: transform 0.3s;
        }

        .vehiculo-header.active .toggle-icon {
            transform: rotate(180deg);
        }

        /* Grid de fotos */
        .fotos-grid {
            display: grid;
            gap: 10px;
            padding: 15px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease-out;
        }

        .fotos-grid.grid-view {
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        }

        .fotos-grid.list-view {
            grid-template-columns: 1fr;
        }

        .fotos-grid.active {
            max-height: 100000px;
            transition: max-height 0.5s ease-in;
        }

        .foto-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            background: #f0f0f0;
        }

        .fotos-grid.grid-view .foto-item {
            aspect-ratio: 1;
        }

        .fotos-grid.list-view .foto-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px;
        }

        .fotos-grid.list-view .foto-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }

        .foto-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .foto-item:hover img {
            transform: scale(1.05);
        }

        /* Overlay de botones en imágenes */
        .foto-overlay {
            position: absolute;
            top: 5px;
            right: 5px;
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .foto-item:hover .foto-overlay {
            opacity: 1;
        }

        .foto-btn {
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .foto-btn:hover {
            transform: scale(1.1);
        }

        .favorito-btn.active {
            color: gold;
        }

        .info-imagen {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* Modal mejorado */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .modal img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 10px;
        }

        .modal-controls {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .nav-btn {
            background: rgba(255,255,255,0.3);
            color: white;
            border: none;
            font-size: 40px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.5);
            transform: scale(1.1);
        }

        .modal-info {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            margin: 0 20px;
            border-radius: 10px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            z-index: 1002;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .vehiculos-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .nav-btn {
                width: 40px;
                height: 40px;
                font-size: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                🚗 Galería de Vehículos 🚙
                <span id="totalFotos"></span>
            </h1>
            <div class="controls">
                <input type="text" id="searchInput" class="search-box" placeholder="🔍 Buscar vehículo...">
                <div class="filter-buttons">
                    <button class="btn" onclick="mostrarFavoritos()">⭐ Favoritos</button>
                    <button class="btn" onclick="mostrarTodo()">📋 Todos</button>
                    <button class="btn view-btn" onclick="cambiarVista()">🖼️ Cambiar vista</button>
                    <button class="btn" onclick="toggleDarkMode()">🌙 Modo oscuro</button>
                </div>
            </div>
        </div>
        
        <div class="vehiculos-grid" id="vehiculosGrid"></div>
    </div>

    <!-- Modal para foto grande con navegación -->
    <div id="modal" class="modal" onclick="cerrarModal()">
        <div class="modal-controls">
            <button class="nav-btn" onclick="event.stopPropagation(); navegarImagen(-1)">❮</button>
            <button class="nav-btn" onclick="event.stopPropagation(); navegarImagen(1)">❯</button>
        </div>
        <div class="modal-content" onclick="event.stopPropagation()">
            <img id="modalImg" src="" alt="">
            <div class="modal-info" id="modalInfo"></div>
        </div>
        <span class="modal-close" onclick="cerrarModal()">&times;</span>
    </div>

    <script>
        // Datos de la aplicación
        let vehiculosData = {{ vehiculos | tojson }};
        let favoritosData = {{ favoritos | tojson }};
        let etiquetasData = {{ etiquetas | tojson }};
        let vistaActual = localStorage.getItem('galeriaVista') || 'grid';
        let modoOscuro = localStorage.getItem('modoOscuro') === 'true';
        let imagenesActuales = [];
        let indiceActual = 0;
        let vehiculoActual = '';

        // Inicializar
        function init() {
            if (modoOscuro) document.body.classList.add('dark-mode');
            actualizarGaleria();
            actualizarTotalFotos();
        }

        // Actualizar galería
        function actualizarGaleria() {
            const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
            const mostrarSoloFavoritos = window.mostrarSoloFavoritos || false;
            
            let filtered = vehiculosData;
            
            if (mostrarSoloFavoritos) {
                filtered = vehiculosData.filter(v => 
                    v.imagenes.some(img => favoritosData[`${v.nombre}/${img.nombre}`])
                );
            }
            
            if (searchTerm) {
                filtered = filtered.filter(v => v.nombre.toLowerCase().includes(searchTerm));
            }
            
            const grid = document.getElementById('vehiculosGrid');
            grid.innerHTML = filtered.map(vehiculo => `
                <div class="vehiculo-card" data-nombre="${vehiculo.nombre}">
                    <div class="vehiculo-header" onclick="toggleVehiculo(this)">
                        <h2>📁 ${vehiculo.nombre}</h2>
                        <div class="vehiculo-stats">
                            <span>📸 ${vehiculo.total_imagenes} fotos</span>
                            <span>⭐ ${vehiculo.imagenes.filter(img => favoritosData[`${vehiculo.nombre}/${img.nombre}`]).length}</span>
                        </div>
                        <span class="toggle-icon">▼</span>
                    </div>
                    <div class="fotos-grid ${vistaActual}-view">
                        ${vehiculo.imagenes.map(img => {
                            const rutaCompleta = `${vehiculo.nombre}/${img.nombre}`;
                            const esFavorito = favoritosData[rutaCompleta];
                            const etiquetas = etiquetasData[rutaCompleta] || [];
                            const tamañoFormateado = img.tamaño < 1024*1024 ? 
                                (img.tamaño/1024).toFixed(1) + ' KB' : 
                                (img.tamaño/(1024*1024)).toFixed(1) + ' MB';
                            return `
                                <div class="foto-item" data-ruta="${rutaCompleta}" data-vehiculo="${vehiculo.nombre}" data-imagen="${img.nombre}">
                                    <img src="/imagen/${rutaCompleta}" alt="${img.nombre}" loading="lazy" 
                                         onclick="abrirModalDesdeElemento(this, '${vehiculo.nombre}', '${img.nombre}')">
                                    <div class="foto-overlay">
                                        <button class="foto-btn favorito-btn ${esFavorito ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavorito('${rutaCompleta}', this)">⭐</button>
                                        <button class="foto-btn" onclick="event.stopPropagation(); mostrarInfo('${vehiculo.nombre}', '${img.nombre}', ${img.tamaño}, '${img.fecha_modificacion}')">ℹ️</button>
                                        <button class="foto-btn" onclick="event.stopPropagation(); agregarEtiqueta('${rutaCompleta}')">🏷️</button>
                                        <button class="foto-btn" onclick="event.stopPropagation(); eliminarImagen('${rutaCompleta}', this)" style="color:#ff4444">🗑️</button>
                                    </div>
                                    ${vistaActual === 'list' ? `<div class="info-imagen" style="position: relative; background: rgba(0,0,0,0.8); display: inline-block;">${img.nombre}</div>` : ''}
                                    ${etiquetas.length ? `<div class="info-imagen" style="top:5px; left:5px; right:auto; bottom:auto">🏷️ ${etiquetas.join(', ')}</div>` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        // Actualizar total de fotos
        function actualizarTotalFotos() {
            const total = vehiculosData.reduce((sum, v) => sum + v.imagenes.length, 0);
            document.getElementById('totalFotos').innerHTML = `📸 Total: ${total} fotos`;
        }

        // Toggle vehículo
        function toggleVehiculo(header) {
            header.classList.toggle('active');
            const fotosGrid = header.parentElement.querySelector('.fotos-grid');
            fotosGrid.classList.toggle('active');
        }

        // Toggle favorito
        async function toggleFavorito(ruta, btn) {
            const response = await fetch('/api/favorito', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ruta: ruta})
            });
            const data = await response.json();
            if (data.success) {
                if (data.es_favorito) {
                    btn.classList.add('active');
                    favoritosData[ruta] = true;
                } else {
                    btn.classList.remove('active');
                    delete favoritosData[ruta];
                }
                actualizarGaleria();
            }
        }

        // Mostrar info
        function mostrarInfo(vehiculo, imagen, tamaño, fecha) {
            const tamañoFormateado = tamaño < 1024*1024 ? 
                (tamaño/1024).toFixed(1) + ' KB' : 
                (tamaño/(1024*1024)).toFixed(1) + ' MB';
            alert(`📷 ${imagen}\n📁 ${vehiculo}\n📏 ${tamañoFormateado}\n📅 ${fecha}`);
        }

        // Agregar etiqueta
        async function agregarEtiqueta(ruta) {
            const etiqueta = prompt('Ingrese una etiqueta para esta foto (ej: motor, interior, lateral):');
            if (etiqueta && etiqueta.trim()) {
                const response = await fetch('/api/etiqueta', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ruta: ruta, etiqueta: etiqueta.trim()})
                });
                const data = await response.json();
                if (data.success) {
                    etiquetasData[ruta] = data.etiquetas;
                    actualizarGaleria();
                }
            }
        }

        // Eliminar imagen
        async function eliminarImagen(ruta, elemento) {
            if (confirm('¿Eliminar esta imagen permanentemente?')) {
                const response = await fetch('/api/eliminar', {
                    method: 'DELETE',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ruta: ruta})
                });
                const data = await response.json();
                if (data.success) {
                    // Actualizar datos locales
                    const [vehiculo, imagen] = ruta.split('/');
                    const vehiculoObj = vehiculosData.find(v => v.nombre === vehiculo);
                    if (vehiculoObj) {
                        vehiculoObj.imagenes = vehiculoObj.imagenes.filter(img => img.nombre !== imagen);
                        vehiculoObj.total_imagenes = vehiculoObj.imagenes.length;
                    }
                    delete favoritosData[ruta];
                    delete etiquetasData[ruta];
                    actualizarGaleria();
                    actualizarTotalFotos();
                } else {
                    alert('Error al eliminar');
                }
            }
        }

        // Abrir modal con navegación
        function abrirModalDesdeElemento(imgElement, vehiculo, imagen) {
            // Obtener todas las imágenes del mismo vehículo
            const fotosGrid = imgElement.closest('.fotos-grid');
            const fotosItems = fotosGrid.querySelectorAll('.foto-item');
            
            imagenesActuales = Array.from(fotosItems).map(item => ({
                ruta: item.dataset.ruta,
                vehiculo: item.dataset.vehiculo,
                imagen: item.dataset.imagen
            }));
            
            indiceActual = imagenesActuales.findIndex(i => i.imagen === imagen);
            vehiculoActual = vehiculo;
            
            const modal = document.getElementById('modal');
            modal.classList.add('active');
            actualizarModalImagen();
        }

        function actualizarModalImagen() {
            const modalImg = document.getElementById('modalImg');
            const modalInfo = document.getElementById('modalInfo');
            const actual = imagenesActuales[indiceActual];
            
            modalImg.src = `/imagen/${actual.ruta}`;
            modalInfo.innerHTML = `
                📷 ${actual.imagen} | 
                📁 ${actual.vehiculo} | 
                📸 ${indiceActual + 1} de ${imagenesActuales.length}
                <button class="btn" style="margin-left:10px" onclick="toggleFavoritoModal()">⭐</button>
            `;
        }

        function navegarImagen(direccion) {
            indiceActual = (indiceActual + direccion + imagenesActuales.length) % imagenesActuales.length;
            actualizarModalImagen();
        }

        async function toggleFavoritoModal() {
            const actual = imagenesActuales[indiceActual];
            const ruta = actual.ruta;
            const response = await fetch('/api/favorito', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ruta: ruta})
            });
            const data = await response.json();
            if (data.success) {
                if (data.es_favorito) {
                    favoritosData[ruta] = true;
                } else {
                    delete favoritosData[ruta];
                }
                actualizarGaleria();
                actualizarModalImagen();
            }
        }

        function cerrarModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Filtros
        function mostrarFavoritos() {
            window.mostrarSoloFavoritos = true;
            actualizarGaleria();
        }

        function mostrarTodo() {
            window.mostrarSoloFavoritos = false;
            document.getElementById('searchInput').value = '';
            actualizarGaleria();
        }

        function cambiarVista() {
            vistaActual = vistaActual === 'grid' ? 'list' : 'grid';
            localStorage.setItem('galeriaVista', vistaActual);
            actualizarGaleria();
        }

        function toggleDarkMode() {
            modoOscuro = !modoOscuro;
            localStorage.setItem('modoOscuro', modoOscuro);
            document.body.classList.toggle('dark-mode', modoOscuro);
        }

        // Búsqueda en tiempo real
        document.addEventListener('DOMContentLoaded', () => {
            init();
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', () => {
                    window.mostrarSoloFavoritos = false;
                    actualizarGaleria();
                });
            }
        });

        // Cerrar modal con ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') cerrarModal();
            if (e.key === 'ArrowLeft' && document.getElementById('modal').classList.contains('active')) navegarImagen(-1);
            if (e.key === 'ArrowRight' && document.getElementById('modal').classList.contains('active')) navegarImagen(1);
        });
    </script>
</body>
</html>
