<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Galería de Vehículos - Mi Colección</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            transition: all 0.3s;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        body.dark-mode .header {
            background: rgba(30,30,40,0.95);
            color: white;
        }

        .header h1 {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            background: #667eea;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .vehiculos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .vehiculo-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        body.dark-mode .vehiculo-card {
            background: #2d2d3a;
            color: white;
        }

        .vehiculo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .vehiculo-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .vehiculo-header h2 {
            font-size: 1.1rem;
            margin: 0;
            word-break: break-word;
        }

        .vehiculo-stats {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
        }

        .preview-container {
            position: relative;
            height: 250px;
            overflow: hidden;
            background: #f0f0f0;
        }

        .preview-imagen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .preview-imagen.active {
            opacity: 1;
            z-index: 2;
        }

        .preview-imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 30px 15px 15px;
            text-align: center;
            z-index: 10;
        }

        .ver-galeria-btn {
            background: rgba(255,255,255,0.95);
            color: #667eea;
            border: none;
            padding: 10px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .ver-galeria-btn:hover {
            background: white;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Modal de galería */
        .galeria-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            backdrop-filter: blur(10px);
        }

        .galeria-modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .galeria-contenedor {
            width: 90%;
            max-width: 1300px;
            height: 85vh;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s ease;
        }

        body.dark-mode .galeria-contenedor {
            background: #2d2d3a;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .galeria-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .galeria-header h2 {
            font-size: 1.4rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .galeria-stats {
            display: flex;
            gap: 20px;
        }

        .cerrar-galeria {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .cerrar-galeria:hover {
            background: rgba(255,255,255,0.4);
            transform: scale(1.1);
        }

        .galeria-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            padding: 25px;
            overflow-y: auto;
            flex: 1;
        }

        .galeria-grid::-webkit-scrollbar {
            width: 8px;
        }

        .galeria-grid::-webkit-scrollbar-track {
            background: #e0e0e0;
            border-radius: 10px;
        }

        .galeria-grid::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .thumbnail-item {
            position: relative;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            aspect-ratio: 1;
        }

        .thumbnail-item:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .thumbnail-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .thumbnail-item:hover img {
            transform: scale(1.1);
        }

        .thumbnail-overlay {
            position: absolute;
            top: 5px;
            right: 5px;
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .thumbnail-item:hover .thumbnail-overlay {
            opacity: 1;
        }

        .thumb-btn {
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .thumb-btn:hover {
            transform: scale(1.1);
            background: rgba(0,0,0,0.9);
        }

        .favorito-thumb.active {
            color: gold;
        }

        .thumb-info {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }

        .thumb-etiquetas {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            max-width: 70%;
        }

        /* Modal de foto */
        .foto-modal {
            display: none;
            position: fixed;
            z-index: 3000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.98);
        }

        .foto-modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .foto-modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .foto-modal img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 10px;
        }

        .foto-modal-controls {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .foto-nav-btn {
            background: rgba(255,255,255,0.3);
            color: white;
            border: none;
            font-size: 40px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s;
        }

        .foto-nav-btn:hover {
            background: rgba(255,255,255,0.5);
            transform: scale(1.1);
        }

        .foto-modal-info {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            margin: 0 20px;
            border-radius: 10px;
        }

        .foto-modal-close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            z-index: 3002;
            transition: all 0.3s;
        }

        .foto-modal-close:hover {
            transform: scale(1.2);
            color: #ff4444;
        }

        @media (max-width: 768px) {
            .vehiculos-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .galeria-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 10px;
                padding: 15px;
            }
            
            .galeria-contenedor {
                width: 95%;
                height: 90vh;
            }
            
            .foto-nav-btn {
                width: 40px;
                height: 40px;
                font-size: 25px;
            }
            
            .preview-container {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                🚗 Galería de Vehículos 🚙
                <span id="totalFotos"></span>
            </h1>
            <div class="controls">
                <input type="text" id="searchInput" class="search-box" placeholder="🔍 Buscar vehículo...">
                <div class="filter-buttons">
                    <button class="btn" onclick="mostrarFavoritos()">⭐ Favoritos</button>
                    <button class="btn" onclick="mostrarTodo()">📋 Todos</button>
                    <button class="btn" onclick="toggleDarkMode()">🌙 Modo oscuro</button>
                </div>
            </div>
        </div>
        
        <div class="vehiculos-grid" id="vehiculosGrid"></div>
    </div>

    <!-- Modal de Galería -->
    <div id="galeriaModal" class="galeria-modal">
        <div class="galeria-contenedor">
            <div class="galeria-header">
                <h2 id="galeriaTitulo">📁 Vehículo</h2>
                <div class="galeria-stats">
                    <span id="galeriaStats">📸 0 fotos</span>
                </div>
                <button class="cerrar-galeria" onclick="cerrarGaleriaModal()">✕</button>
            </div>
            <div class="galeria-grid" id="galeriaGrid"></div>
        </div>
    </div>

    <!-- Modal de Foto Grande -->
    <div id="fotoModal" class="foto-modal" onclick="cerrarFotoModal()">
        <div class="foto-modal-controls">
            <button class="foto-nav-btn" onclick="event.stopPropagation(); navegarFoto(-1)">❮</button>
            <button class="foto-nav-btn" onclick="event.stopPropagation(); navegarFoto(1)">❯</button>
        </div>
        <div class="foto-modal-content" onclick="event.stopPropagation()">
            <img id="fotoModalImg" src="" alt="">
            <div class="foto-modal-info" id="fotoModalInfo"></div>
        </div>
        <span class="foto-modal-close" onclick="cerrarFotoModal()">&times;</span>
    </div>

    <script>
        let vehiculosData = {{ vehiculos | tojson }};
        let favoritosData = {{ favoritos | tojson }};
        let etiquetasData = {{ etiquetas | tojson }};
        let modoOscuro = localStorage.getItem('modoOscuro') === 'true';
        let imagenesActuales = [];
        let indiceActual = 0;
        let vehiculoActual = null;
        let hoverIntervals = {};

        function init() {
            if (modoOscuro) document.body.classList.add('dark-mode');
            actualizarGaleria();
            actualizarTotalFotos();
        }

        function actualizarGaleria() {
            const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
            const mostrarSoloFavoritos = window.mostrarSoloFavoritos || false;
            
            let filtered = vehiculosData;
            
            if (mostrarSoloFavoritos) {
                filtered = vehiculosData.filter(v => 
                    v.imagenes.some(img => favoritosData[`${v.nombre}/${img.nombre}`])
                );
            }
            
            if (searchTerm) {
                filtered = filtered.filter(v => v.nombre.toLowerCase().includes(searchTerm));
            }
            
            const grid = document.getElementById('vehiculosGrid');
            grid.innerHTML = filtered.map(vehiculo => {
                const favoritosCount = vehiculo.imagenes.filter(img => favoritosData[`${vehiculo.nombre}/${img.nombre}`]).length;
                
                // Generar hasta 5 imágenes preview (o todas si son menos)
                const previewImages = vehiculo.imagenes.slice(0, 5);
                
                return `
                    <div class="vehiculo-card" data-nombre="${vehiculo.nombre}" data-vehiculo-id="${vehiculo.nombre.replace(/[^a-zA-Z0-9]/g, '-')}">
                        <div class="vehiculo-header">
                            <h2>📁 ${vehiculo.nombre}</h2>
                            <div class="vehiculo-stats">
                                <span>📸 ${vehiculo.total_imagenes}</span>
                                ${favoritosCount > 0 ? `<span>⭐ ${favoritosCount}</span>` : ''}
                            </div>
                        </div>
                        <div class="preview-container" id="preview-${vehiculo.nombre.replace(/[^a-zA-Z0-9]/g, '-')}">
                            ${previewImages.map((img, idx) => {
                                const rutaCompleta = `${vehiculo.nombre}/${img.nombre}`;
                                return `
                                    <div class="preview-imagen ${idx === 0 ? 'active' : ''}" data-index="${idx}">
                                        <img src="/imagen/${rutaCompleta}" alt="${vehiculo.nombre}">
                                    </div>
                                `;
                            }).join('')}
                            <div class="preview-overlay">
                                <button class="ver-galeria-btn" onclick="event.stopPropagation(); abrirGaleriaModal('${vehiculo.nombre}')">
                                    🔍 Ver galería completa (${vehiculo.total_imagenes} fotos)
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            // Inicializar los efectos hover para cada tarjeta
            filtered.forEach(vehiculo => {
                const cardId = `preview-${vehiculo.nombre.replace(/[^a-zA-Z0-9]/g, '-')}`;
                const container = document.getElementById(cardId);
                if (container && vehiculo.imagenes.length > 1) {
                    initHoverEffect(container, vehiculo.nombre);
                }
            });
        }

        function initHoverEffect(container, vehiculoNombre) {
            const previews = container.querySelectorAll('.preview-imagen');
            if (previews.length <= 1) return;
            
            let currentIndex = 0;
            let hoverTimeout = null;
            let intervalId = null;
            
            const startSlideshow = () => {
                if (intervalId) clearInterval(intervalId);
                intervalId = setInterval(() => {
                    // Cambiar a la siguiente imagen aleatoriamente
                    let newIndex;
                    do {
                        newIndex = Math.floor(Math.random() * previews.length);
                    } while (newIndex === currentIndex && previews.length > 1);
                    
                    // Cambiar imagen activa
                    previews[currentIndex].classList.remove('active');
                    previews[newIndex].classList.add('active');
                    currentIndex = newIndex;
                }, 800); // Cambiar cada 800ms
            };
            
            const stopSlideshow = () => {
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                }
                // Reset a la primera imagen
                previews[currentIndex].classList.remove('active');
                previews[0].classList.add('active');
                currentIndex = 0;
            };
            
            container.addEventListener('mouseenter', () => {
                if (hoverTimeout) clearTimeout(hoverTimeout);
                startSlideshow();
            });
            
            container.addEventListener('mouseleave', () => {
                if (hoverTimeout) clearTimeout(hoverTimeout);
                hoverTimeout = setTimeout(() => {
                    stopSlideshow();
                }, 100);
            });
            
            // Guardar interval para cleanup
            hoverIntervals[vehiculoNombre] = {
                stop: stopSlideshow,
                container: container
            };
        }

        function actualizarTotalFotos() {
            const total = vehiculosData.reduce((sum, v) => sum + v.imagenes.length, 0);
            document.getElementById('totalFotos').innerHTML = `📸 Total: ${total} fotos`;
        }

        function abrirGaleriaModal(nombreVehiculo) {
            const vehiculo = vehiculosData.find(v => v.nombre === nombreVehiculo);
            if (!vehiculo) return;
            
            vehiculoActual = vehiculo;
            
            document.getElementById('galeriaTitulo').innerHTML = `📁 ${vehiculo.nombre}`;
            document.getElementById('galeriaStats').innerHTML = `📸 ${vehiculo.total_imagenes} fotos | ⭐ ${vehiculo.imagenes.filter(img => favoritosData[`${vehiculo.nombre}/${img.nombre}`]).length}`;
            
            const grid = document.getElementById('galeriaGrid');
            grid.innerHTML = vehiculo.imagenes.map(img => {
                const rutaCompleta = `${vehiculo.nombre}/${img.nombre}`;
                const esFavorito = favoritosData[rutaCompleta];
                const etiquetas = etiquetasData[rutaCompleta] || [];
                const tamañoFormateado = img.tamaño < 1024*1024 ? 
                    (img.tamaño/1024).toFixed(0) + ' KB' : 
                    (img.tamaño/(1024*1024)).toFixed(1) + ' MB';
                
                return `
                    <div class="thumbnail-item" data-ruta="${rutaCompleta}" data-vehiculo="${vehiculo.nombre}" data-imagen="${img.nombre}">
                        <img src="/imagen/${rutaCompleta}" alt="${img.nombre}" loading="lazy" 
                             onclick="abrirFotoModal('${vehiculo.nombre}', '${img.nombre}')">
                        <div class="thumbnail-overlay">
                            <button class="thumb-btn favorito-thumb ${esFavorito ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavoritoDesdeGaleria('${rutaCompleta}', this)">⭐</button>
                            <button class="thumb-btn" onclick="event.stopPropagation(); mostrarInfo('${vehiculo.nombre}', '${img.nombre}', '${tamañoFormateado}', '${img.fecha_modificacion}')">ℹ️</button>
                            <button class="thumb-btn" onclick="event.stopPropagation(); agregarEtiquetaDesdeGaleria('${rutaCompleta}')">🏷️</button>
                            <button class="thumb-btn" onclick="event.stopPropagation(); eliminarImagen('${rutaCompleta}', this)" style="color:#ff4444">🗑️</button>
                        </div>
                        ${etiquetas.length ? `<div class="thumb-etiquetas">🏷️ ${etiquetas.slice(0, 2).join(', ')}${etiquetas.length > 2 ? '+' : ''}</div>` : ''}
                        <div class="thumb-info">${img.nombre}</div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('galeriaModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function cerrarGaleriaModal() {
            document.getElementById('galeriaModal').classList.remove('active');
            document.body.style.overflow = '';
            vehiculoActual = null;
        }

        function abrirFotoModal(vehiculo, imagen) {
            if (!vehiculoActual || vehiculoActual.nombre !== vehiculo) {
                vehiculoActual = vehiculosData.find(v => v.nombre === vehiculo);
            }
            
            imagenesActuales = vehiculoActual.imagenes.map(img => ({
                ruta: `${vehiculoActual.nombre}/${img.nombre}`,
                vehiculo: vehiculoActual.nombre,
                imagen: img.nombre
            }));
            
            indiceActual = imagenesActuales.findIndex(i => i.imagen === imagen);
            
            const modal = document.getElementById('fotoModal');
            modal.classList.add('active');
            actualizarFotoModal();
            document.body.style.overflow = 'hidden';
        }

        function actualizarFotoModal() {
            const modalImg = document.getElementById('fotoModalImg');
            const modalInfo = document.getElementById('fotoModalInfo');
            const actual = imagenesActuales[indiceActual];
            
            modalImg.src = `/imagen/${actual.ruta}`;
            modalInfo.innerHTML = `
                📷 ${actual.imagen} | 
                📁 ${actual.vehiculo} | 
                📸 ${indiceActual + 1} de ${imagenesActuales.length}
                <button class="btn" style="margin-left:10px" onclick="toggleFavoritoDesdeFoto()">⭐</button>
            `;
        }

        function navegarFoto(direccion) {
            indiceActual = (indiceActual + direccion + imagenesActuales.length) % imagenesActuales.length;
            actualizarFotoModal();
        }

        function cerrarFotoModal() {
            document.getElementById('fotoModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        async function toggleFavoritoDesdeGaleria(ruta, btn) {
            const response = await fetch('/api/favorito', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ruta: ruta})
            });
            const data = await response.json();
            if (data.success) {
                if (data.es_favorito) {
                    btn.classList.add('active');
                    favoritosData[ruta] = true;
                } else {
                    btn.classList.remove('active');
                    delete favoritosData[ruta];
                }
                if (vehiculoActual) {
                    const favoritosCount = vehiculoActual.imagenes.filter(img => favoritosData[`${vehiculoActual.nombre}/${img.nombre}`]).length;
                    document.getElementById('galeriaStats').innerHTML = `📸 ${vehiculoActual.total_imagenes} fotos | ⭐ ${favoritosCount}`;
                }
                actualizarGaleria();
            }
        }

        async function toggleFavoritoDesdeFoto() {
            const actual = imagenesActuales[indiceActual];
            const ruta = actual.ruta;
            const response = await fetch('/api/favorito', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ruta: ruta})
            });
            const data = await response.json();
            if (data.success) {
                if (data.es_favorito) {
                    favoritosData[ruta] = true;
                } else {
                    delete favoritosData[ruta];
                }
                if (vehiculoActual) {
                    const favoritosCount = vehiculoActual.imagenes.filter(img => favoritosData[`${vehiculoActual.nombre}/${img.nombre}`]).length;
                    document.getElementById('galeriaStats').innerHTML = `📸 ${vehiculoActual.total_imagenes} fotos | ⭐ ${favoritosCount}`;
                }
                actualizarGaleria();
                actualizarFotoModal();
                
                if (document.getElementById('galeriaModal').classList.contains('active')) {
                    const btn = document.querySelector(`.thumbnail-item[data-ruta="${ruta}"] .favorito-thumb`);
                    if (btn) {
                        if (data.es_favorito) {
                            btn.classList.add('active');
                        } else {
                            btn.classList.remove('active');
                        }
                    }
                }
            }
        }

        async function agregarEtiquetaDesdeGaleria(ruta) {
            const etiqueta = prompt('Ingrese una etiqueta para esta foto (ej: motor, interior, lateral):');
            if (etiqueta && etiqueta.trim()) {
                const response = await fetch('/api/etiqueta', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ruta: ruta, etiqueta: etiqueta.trim()})
                });
                const data = await response.json();
                if (data.success) {
                    etiquetasData[ruta] = data.etiquetas;
                    actualizarGaleria();
                    if (document.getElementById('galeriaModal').classList.contains('active') && vehiculoActual) {
                        abrirGaleriaModal(vehiculoActual.nombre);
                    }
                }
            }
        }

        function mostrarInfo(vehiculo, imagen, tamaño, fecha) {
            alert(`📷 ${imagen}\n📁 ${vehiculo}\n📏 ${tamaño}\n📅 ${fecha}`);
        }

        async function eliminarImagen(ruta, elemento) {
            if (confirm('¿Eliminar esta imagen permanentemente?')) {
                const response = await fetch('/api/eliminar', {
                    method: 'DELETE',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ruta: ruta})
                });
                const data = await response.json();
                if (data.success) {
                    const [vehiculo, imagen] = ruta.split('/');
                    const vehiculoObj = vehiculosData.find(v => v.nombre === vehiculo);
                    if (vehiculoObj) {
                        vehiculoObj.imagenes = vehiculoObj.imagenes.filter(img => img.nombre !== imagen);
                        vehiculoObj.total_imagenes = vehiculoObj.imagenes.length;
                    }
                    delete favoritosData[ruta];
                    delete etiquetasData[ruta];
                    actualizarGaleria();
                    actualizarTotalFotos();
                    
                    if (document.getElementById('galeriaModal').classList.contains('active') && vehiculoActual && vehiculoActual.nombre === vehiculo) {
                        if (vehiculoActual.imagenes.length > 0) {
                            abrirGaleriaModal(vehiculo);
                        } else {
                            cerrarGaleriaModal();
                        }
                    }
                } else {
                    alert('Error al eliminar');
                }
            }
        }

        function mostrarFavoritos() {
            window.mostrarSoloFavoritos = true;
            actualizarGaleria();
        }

        function mostrarTodo() {
            window.mostrarSoloFavoritos = false;
            document.getElementById('searchInput').value = '';
            actualizarGaleria();
        }

        function toggleDarkMode() {
            modoOscuro = !modoOscuro;
            localStorage.setItem('modoOscuro', modoOscuro);
            document.body.classList.toggle('dark-mode', modoOscuro);
        }

        document.addEventListener('DOMContentLoaded', () => {
            init();
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', () => {
                    window.mostrarSoloFavoritos = false;
                    actualizarGaleria();
                });
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                cerrarFotoModal();
                cerrarGaleriaModal();
            }
            if (e.key === 'ArrowLeft' && document.getElementById('fotoModal').classList.contains('active')) navegarFoto(-1);
            if (e.key === 'ArrowRight' && document.getElementById('fotoModal').classList.contains('active')) navegarFoto(1);
        });
    </script>
</body>
</html>
